<style>
:root{--bg:#f7f6f2;--ink:#16221d;--muted:#68736d;--line:#dce1db;--green:#234f3c;--pale:#e9eee8;--white:#fff;--accent:#bd8f58;--danger:#a03c38}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{max-width:900px;margin:auto;min-height:100dvh;padding-bottom:105px}header{padding:calc(env(safe-area-inset-top) + 23px) 20px 18px;background:#132920;color:white;border-radius:0 0 26px 26px}header .eyebrow{color:#bdcfc4;font-size:12px;text-transform:uppercase;letter-spacing:2px}header h1{font-size:30px;margin:6px 0 5px;font-family:Georgia,serif;font-weight:500}header p{margin:0;color:#d3dfd8;font-size:13px}main{padding:20px 16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 16px}.section-head h2{font:500 25px Georgia,serif;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:100px;background:white;color:var(--ink)}.primary{background:var(--green);color:white;border:0;border-radius:14px;padding:12px 16px;font-weight:600}.secondary{background:var(--pale);color:var(--ink);border:0;border-radius:14px;padding:12px 16px;font-weight:600}.danger{background:#f8e8e5;color:var(--danger);border:none;border-radius:12px;padding:10px 12px}.ghost{border:none;background:none;color:var(--green);font-weight:600;padding:7px}.full{width:100%}.top-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:white;border:1px solid var(--line);border-radius:17px;padding:15px 10px}.stat strong{display:block;font-size:26px}.stat span{color:var(--muted);font-size:12px}.panel{background:white;border:1px solid var(--line);border-radius:19px;padding:16px;margin-top:16px}.panel h3{margin:0 0 12px;font-size:16px}.item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:560px){.item-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.item{background:white;border-radius:17px;border:1px solid var(--line);overflow:hidden;text-align:left;padding:0;color:var(--ink)}.thumb{aspect-ratio:1/1;background:#ebeee9;display:grid;place-items:center;overflow:hidden;color:#98a69c;font-size:38px}.thumb img{width:100%;height:100%;object-fit:cover}.item-body{padding:10px}.item-body strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-body span{font-size:11px;color:var(--muted)}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.filters{display:flex;overflow-x:auto;gap:7px;padding-bottom:12px;scrollbar-width:none}.filters button{white-space:nowrap}.selected{background:var(--green)!important;color:white!important;border-color:var(--green)!important}.empty{text-align:center;padding:32px 14px;color:var(--muted);border:1px dashed #cad2ca;border-radius:18px;background:#fcfdfa}.empty .emoji{font-size:36px;display:block;margin-bottom:9px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;gap:2px;padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:none;color:#738077;min-width:64px;padding:7px 5px;font-size:11px;display:grid;gap:4px;justify-items:center}.bottom button b{font-size:21px;font-weight:400}.bottom button.active{color:var(--green);font-weight:750}.sheetbg{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:end;justify-content:center}.sheet{background:white;border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;width:100%;max-width:650px}.sheet h2{font:500 25px Georgia,serif;margin:2px 0 15px}.field{margin-bottom:13px}.field label{display:block;font-weight:650;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;background:#f9faf8;border:1px solid #d7ded6;border-radius:12px;color:var(--ink);font-size:16px}.field textarea{min-height:75px;resize:vertical}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo-preview{width:110px;height:110px;object-fit:cover;border-radius:13px;background:#ecf0eb}.chooser{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{border:2px solid transparent;border-radius:12px;overflow:hidden;background:#f5f6f3;padding:0;text-align:left;color:var(--ink)}.choice.chosen{border-color:var(--green)}.choice .thumb{aspect-ratio:1}.choice .cap{padding:6px;font-size:11px;min-height:37px}.selected-preview{display:flex;gap:7px;overflow-x:auto;padding:6px 0 14px}.mini{min-width:70px;width:70px;flex-shrink:0}.mini .thumb{border-radius:10px}.outfit-card{background:white;border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:12px}.outfit-images{display:flex;gap:5px;margin:9px 0 11px}.outfit-images .thumb{width:23%;border-radius:10px}.tag{background:#e9eee9;color:#315441;border-radius:30px;padding:4px 8px;font-size:11px;display:inline-block}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar .weekday{text-align:center;font-size:11px;color:var(--muted);padding:8px 0}.day{border:1px solid var(--line);border-radius:11px;background:white;min-height:68px;padding:6px 2px;text-align:center;color:var(--ink)}.day.has{border-color:#8ba997;background:#ecf4ed}.day.current{box-shadow:inset 0 0 0 2px var(--green)}.day .num{display:block;font-size:12px}.day .dot{display:block;margin:7px auto 0;background:var(--green);height:6px;width:6px;border-radius:50%}.worn-entry{padding:12px 0;border-bottom:1px solid var(--line)}.worn-entry:last-child{border:none}.hidden{display:none!important}.notice{padding:12px;background:#f3eadd;border-radius:12px;font-size:13px;color:#705431}.search{width:100%;padding:12px 14px;margin-bottom:12px;border-radius:13px;border:1px solid var(--line);background:white;font-size:16px}button:focus-visible{outline:3px solid var(--accent)}
.photo-preview{display:block}.photo-preview.hidden{display:none}</style></head><body><div class="app"><header><div class="eyebrow">Personal style archive</div><h1>My Wardrobe</h1><p>Your clothes. Your outfits. Your rotation.</p></header><main id="main"></main></div><nav class="bottom" id="nav"></nav><div id="modal"></div><script>
'use strict';
const CATS=['Tops','Trousers','Jackets','Shoes','Knitwear','Accessories','Other']; const STYLES=['Office Smart Casual','European Casual','Quiet Luxury','Contemporary Ivy','Street Heritage','City Nomad','Retro Americana','Soft Utility','Minimal Street','Urban Prep','Leisure Luxury','Modern Military','Vintage Workwear','Travel Functional','Retro Urban','Creative Hybrid','Other'];
const STYLE_NUMBERS={'Soft Utility':21,'Minimal Street':24,'Urban Prep':27,'Leisure Luxury':29,'Modern Military':30,'European Casual':31,'Quiet Luxury':34,'Contemporary Ivy':35,'Street Heritage':36,'City Nomad':38,'Retro Americana':39,'Vintage Workwear':43,'Travel Functional':47,'Retro Urban':48,'Creative Hybrid':50};
const styleLabel=s=>(STYLE_NUMBERS[s]?'#'+STYLE_NUMBERS[s]+' · ':'')+(s||'Personal style');
const STARTER=[
['Dark forest-green leather zip jacket','Jackets','Forest green','Casa das Peles'],
['Royal blue and charcoal athletic jacket','Jackets','Royal blue / charcoal','Columbia'],
['Black and white microcheck sport coat','Jackets','Black / white',''],
['Charcoal three-button tailored jacket','Jackets','Charcoal','René Lezard'],
['Charcoal-brown windowpane overshirt','Jackets','Charcoal / brown','Gents Shop'],
['Dark solid three-button sport coat','Jackets','Black / charcoal',''],
['Brown suede jacket','Jackets','Brown',''],
['Dark emerald chinos','Trousers','Dark emerald',''],
['White leather Vans Old Skool','Shoes','White','Vans'],
['Black suede Adidas Gazelle','Shoes','Black','Adidas'],
['White and black Adidas Samba OG','Shoes','White / black','Adidas'],
['Yellow Onitsuka Tiger sneakers','Shoes','Yellow / black','Onitsuka Tiger'],
['Dark chocolate suede Boston clogs','Shoes','Dark chocolate','Birkenstock'],
['Taupe Arizona sandals','Shoes','Taupe','Birkenstock'],
['Black leather Chelsea boots','Shoes','Black',''],
['Tan suede desert boots','Shoes','Tan',''],
['Dark brown suede wingtip derby','Shoes','Dark brown',''],
['Black leather tassel loafers','Shoes','Black',''],
['Tan leather bit loafers','Shoes','Tan',''],
['Black charcoal Versace scarf','Accessories','Black / charcoal','Versace'],
['Teal blue Versace scarf','Accessories','Teal / blue','Versace']
];
const $=s=>document.querySelector(s), el=(tag,cls='',content='')=>{let x=document.createElement(tag);x.className=cls;x.textContent=content;return x}; const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(); const today=()=>new Date().toLocaleDateString('en-CA'); const nice=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
let db,items=[],outfits=[],wears=[],tab='home',filter='All',query='',month=new Date().toISOString().slice(0,7),selectedDate=today(),currentEdit=null,selectedItems=[];
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('mywardrobe-private-v1',1);r.onupgradeneeded=()=>{for(let name of ['items','outfits','wears'])if(!r.result.objectStoreNames.contains(name))r.result.createObjectStore(name,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((resolve,reject)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(store,obj){return new Promise((resolve,reject)=>{let r=db.transaction(store,'readwrite').objectStore(store).put(obj);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function del(store,id){return new Promise((resolve,reject)=>{let r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
async function refresh(){[items,outfits,wears]=await Promise.all(['items','outfits','wears'].map(all));render()}
const photo=(src,emoji='👕')=>src?`<img src="${src}" alt="Clothing photo" loading="lazy">`:emoji;
const thumb=(src,emoji)=>`<div class="thumb">${photo(src,emoji)}</div>`;
const wearCount=id=>wears.filter(w=>{let o=outfits.find(o=>o.id===w.outfitId);return o?.itemIds?.includes(id)}).length;
function render(){let defs=[['home','⌂','Home'],['closet','▦','Closet'],['build','✦','Create'],['calendar','▣','Calendar'],['more','☰','More']];$('#nav').innerHTML=defs.map(([id,ic,name])=>`<button class="${tab===id?'active':''}" data-tab="${id}"><b>${ic}</b>${name}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});let m=$('#main');({home:renderHome,closet:renderCloset,build:renderBuild,calendar:renderCalendar,more:renderMore}[tab])(m)}
function renderHome(m){let recent=[...wears].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);m.innerHTML=`<div class="section-head"><h2>Good to see you.</h2><span class="tag">Private on this device</span></div><div class="top-stats"><div class="stat"><strong>${items.length}</strong><span>Garments</span></div><div class="stat"><strong>${outfits.length}</strong><span>Saved looks</span></div><div class="stat"><strong>${wears.length}</strong><span>Days logged</span></div></div><div class="panel"><h3>Build your personal closet</h3><p class="muted small">Add a clothing photo, then combine your items into outfits. When you wear an outfit, log it to your calendar.</p><div class="btnrow"><button class="primary" id="add">+ Add clothing</button><button class="secondary" id="make">Create an outfit</button></div></div><div class="panel"><div class="section-head"><h3>Recently worn</h3><button class="ghost" id="seeCalendar">See calendar</button></div>${recent.length?recent.map(w=>{let o=outfits.find(x=>x.id===w.outfitId);return `<div class="worn-entry"><strong>${esc(o?.name||'Deleted outfit')}</strong><div class="muted small">${nice(w.date)} · ${esc(styleLabel(o?.style))}${w.note?' · '+esc(w.note):''}</div></div>`}).join(''):'<div class="empty"><span class="emoji">📅</span>Your outfit history will appear here.</div>'}</div>`;$('#add').onclick=()=>openItem();$('#make').onclick=()=>{tab='build';render()};$('#seeCalendar').onclick=()=>{tab='calendar';render()}}
function renderCloset(m){let cats=['All',...CATS];let filtered=items.filter(i=>(filter==='All'||i.category===filter)&&(`${i.name} ${i.color||''} ${i.brand||''}`.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name));m.innerHTML=`<div class="section-head"><h2>My Closet</h2><button class="primary" id="add">+ Add item</button></div><input class="search" id="search" placeholder="Search your clothes" value="${esc(query)}"><div class="filters">${cats.map(c=>`<button class="pill ${filter===c?'selected':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="item-grid">${filtered.map(i=>`<button class="item" data-item="${i.id}">${thumb(i.photo,i.category==='Shoes'?'👟':i.category==='Jackets'?'🧥':'👕')}<div class="item-body"><strong>${esc(i.name)}</strong><span>${esc(i.color||i.category)} · Worn ${wearCount(i.id)}×</span></div></button>`).join('')}</div>${!filtered.length?'<div class="empty"><span class="emoji">👕</span>No clothing found. Add your first item to get started.</div>':''}`;$('#add').onclick=()=>openItem();$('#search').oninput=e=>{query=e.target.value;renderCloset(m);$('#search').focus();$('#search').setSelectionRange(query.length,query.length)};m.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{filter=b.dataset.cat;render()});m.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>openItem(items.find(i=>i.id===b.dataset.item)))}
function renderBuild(m){m.innerHTML=`<div class="section-head"><h2>Outfit Studio</h2><button class="primary" id="new">+ New outfit</button></div>${outfits.length?outfits.slice().reverse().map(o=>`<div class="outfit-card"><div class="section-head"><div><strong>${esc(o.name)}</strong><div class="muted small">${esc(styleLabel(o.style))} · ${o.itemIds.length} items</div></div><span class="tag">Worn ${wears.filter(w=>w.outfitId===o.id).length}×</span></div><div class="outfit-images">${o.itemIds.slice(0,4).map(id=>{let i=items.find(x=>x.id===id);return thumb(i?.photo,'👕')}).join('')}</div><div class="btnrow"><button class="primary" data-log="${o.id}">Log as worn</button><button class="secondary" data-edit="${o.id}">Edit</button><button class="ghost" data-remove="${o.id}">Delete</button></div></div>`).join(''):'<div class="empty"><span class="emoji">✨</span>No outfits yet. Start by combining clothing from your closet.</div>'}`;$('#new').onclick=()=>openOutfit();m.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>openLog(b.dataset.log));m.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOutfit(outfits.find(o=>o.id===b.dataset.edit)));m.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this outfit? Its wear-log entries will also be deleted.')){await del('outfits',b.dataset.remove);for(let w of wears.filter(w=>w.outfitId===b.dataset.remove))await del('wears',w.id);refresh()}})}
function renderCalendar(m){let [year,mo]=month.split('-').map(Number),first=new Date(year,mo-1,1),days=new Date(year,mo,0).getDate(),offset=first.getDay();let cells=Array.from({length:offset},()=>'<div></div>').join('');for(let d=1;d<=days;d++){let date=month+'-'+String(d).padStart(2,'0');cells+=`<button class="day ${wears.some(w=>w.date===date)?'has':''} ${selectedDate===date?'current':''}" data-date="${date}"><span class="num">${d}</span>${wears.some(w=>w.date===date)?'<span class="dot"></span>':''}</button>`}let logs=wears.filter(w=>w.date===selectedDate);m.innerHTML=`<div class="section-head"><h2>Wear Calendar</h2><button class="primary" id="log">+ Log outfit</button></div><div class="panel"><div class="section-head"><button class="ghost" id="prev">‹ Previous</button><strong>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</strong><button class="ghost" id="next">Next ›</button></div><div class="calendar">${['S','M','T','W','T','F','S'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells}</div></div><div class="panel"><h3>${nice(selectedDate)}</h3>${logs.length?logs.map(w=>{let o=outfits.find(o=>o.id===w.outfitId);return `<div class="worn-entry"><strong>${esc(o?.name||'Deleted outfit')}</strong><div class="small muted">${esc(w.note||styleLabel(o?.style))}</div>${w.selfie?`<img src="${w.selfie}" alt="Outfit selfie" style="display:block;width:130px;height:180px;object-fit:cover;border-radius:12px;margin:9px 0">`: ''}<button class="ghost" data-unlog="${w.id}">Remove log</button></div>`}).join(''):'<p class="muted">No outfits logged for this day.</p>'}</div>`;$('#prev').onclick=()=>moveMonth(-1);$('#next').onclick=()=>moveMonth(1);$('#log').onclick=()=>openLog();m.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render()});m.querySelectorAll('[data-unlog]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this wear log?')){await del('wears',b.dataset.unlog);refresh()}})}
function moveMonth(n){let [y,m]=month.split('-').map(Number);let x=new Date(y,m-1+n,1);month=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;selectedDate=month+'-01';render()}
function renderMore(m){let sorted=items.map(i=>({...i,count:wearCount(i.id)})).sort((a,b)=>b.count-a.count);m.innerHTML=`<div class="section-head"><h2>Insights & Backup</h2></div><div class="panel"><h3>Your most-worn pieces</h3>${sorted.length?sorted.slice(0,8).map(i=>`<div class="worn-entry"><strong>${esc(i.name)}</strong><span class="muted small"> · ${i.count} wears</span></div>`).join(''):'<p class="muted">Wear counts will appear after you log outfits.</p>'}</div><div class="panel"><h3>Import your starter wardrobe</h3><p class="small muted">Add 21 clothing pieces from your previously cataloged wardrobe, ready for you to attach photos and verify details. Existing matching item names will be skipped.</p><button class="secondary" id="starter">Add 21 known items</button></div><div class="panel"><h3>Protect your wardrobe</h3><p class="small muted">Your wardrobe stays in this browser's local storage. It is not sent to a server. Deleting Safari website data or switching devices can erase it. Export backups regularly.</p><div class="btnrow"><button class="primary" id="export">Export backup (.json)</button><button class="secondary" id="import">Import backup</button></div><input type="file" accept=".json,application/json" id="importFile" class="hidden"><p class="notice">Save backups to iCloud Drive or Files. The export includes your clothing photos and outfit records, so keep the file private.</p></div><div class="panel"><h3>About your personal app</h3><p class="small muted">No subscriptions, accounts, ads, or tracking. This version includes wardrobe cataloging, outfit boards, calendar selfies, style labels, wear statistics, starter items, and backup tools. For reliable Home Screen use, host this file on an HTTPS static site and add it from Safari.</p></div>`;$('#starter').onclick=importStarter;$('#export').onclick=exportBackup;$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=importBackup}
function showModal(html){$('#modal').innerHTML=`<div class="sheetbg" id="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};$('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){$('#modal').innerHTML=''}
async function compress(file){if(!file)return '';return new Promise((res,rej)=>{let image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{let ratio=Math.min(1,850/Math.max(image.width,image.height)),c=document.createElement('canvas');c.width=Math.round(image.width*ratio);c.height=Math.round(image.height*ratio);c.getContext('2d').drawImage(image,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.76))};image.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read photo'))};image.src=url})}
function openItem(item=null){let i=item||{},editing=!!item;showModal(`<div class="section-head"><h2>${editing?'Edit clothing':'Add clothing'}</h2><button class="ghost" data-close>Close</button></div><form id="itemForm"><div class="field"><label>Photo</label>${i.photo?`<img class="photo-preview" id="preview" src="${i.photo}">`:'<img class="photo-preview hidden" id="preview">'}<input type="file" id="photoFile" accept="image/*" style="margin-top:7px"></div><div class="field"><label>Item name *</label><input id="name" required maxlength="90" placeholder="Dark forest-green leather jacket" value="${esc(i.name||'')}"></div><div class="split"><div class="field"><label>Category</label><select id="category">${CATS.map(c=>`<option ${i.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Color</label><input id="color" placeholder="Forest green" value="${esc(i.color||'')}"></div></div><div class="split"><div class="field"><label>Brand</label><input id="brand" value="${esc(i.brand||'')}"></div><div class="field"><label>Purchase price ($)</label><input id="price" type="number" min="0" step="0.01" value="${i.price??''}"></div></div><div class="field"><label>Notes</label><textarea id="notes" placeholder="Fit, fabric, outfit ideas...">${esc(i.notes||'')}</textarea></div><div class="btnrow"><button class="primary" type="submit">Save clothing</button>${editing?'<button type="button" class="danger" id="deleteItem">Delete item</button>':''}</div></form>`);let img=i.photo||'';$('#photoFile').onchange=async e=>{if(e.target.files[0]){try{img=await compress(e.target.files[0]);$('#preview').src=img;$('#preview').classList.remove('hidden')}catch(err){alert(err.message)}}};$('#itemForm').onsubmit=async e=>{e.preventDefault();let obj={id:i.id||uid(),name:$('#name').value.trim(),category:$('#category').value,color:$('#color').value.trim(),brand:$('#brand').value.trim(),price:$('#price').value===''?null:Number($('#price').value),notes:$('#notes').value.trim(),photo:img,createdAt:i.createdAt||Date.now()};await put('items',obj);closeModal();refresh()};if(editing)$('#deleteItem').onclick=async()=>{if(confirm('Delete this garment? It will also be removed from saved outfits.')){await del('items',i.id);for(let o of outfits.filter(o=>o.itemIds.includes(i.id)))await put('outfits',{...o,itemIds:o.itemIds.filter(id=>id!==i.id)});closeModal();refresh()}}}
function openOutfit(outfit=null){if(!items.length){alert('Add at least one clothing item first.');tab='closet';render();return}let o=outfit||{};selectedItems=[...(o.itemIds||[])];showModal(`<div class="section-head"><h2>${outfit?'Edit outfit':'Create outfit'}</h2><button class="ghost" data-close>Close</button></div><form id="outfitForm"><div class="field"><label>Outfit name *</label><input id="outfitName" required maxlength="90" placeholder="Monday office look" value="${esc(o.name||'')}"></div><div class="field"><label>Style category</label><select id="style">${STYLES.map(s=>`<option value="${esc(s)}" ${o.style===s?'selected':''}>${esc(styleLabel(s))}</option>`).join('')}</select></div><div class="field"><label>Occasion or notes</label><input id="occasion" placeholder="Office, dinner, weekend..." value="${esc(o.occasion||'')}"></div><h3>Select your clothes <span id="count" class="muted small"></span></h3><div class="selected-preview" id="selectedPreview"></div><div class="chooser" id="chooser"></div><button type="submit" class="primary full" style="margin-top:16px">Save outfit</button></form>`);function redraw(){let avail=[...items].sort((a,b)=>CATS.indexOf(a.category)-CATS.indexOf(b.category));$('#chooser').innerHTML=avail.map(i=>`<button type="button" class="choice ${selectedItems.includes(i.id)?'chosen':''}" data-choose="${i.id}">${thumb(i.photo,'👕')}<div class="cap">${esc(i.name)} ${selectedItems.includes(i.id)?'✓':''}</div></button>`).join('');$('#selectedPreview').innerHTML=selectedItems.length?selectedItems.map(id=>{let i=items.find(x=>x.id===id);return `<div class="mini">${thumb(i?.photo,'👕')}</div>`}).join(''):'<span class="muted small">Tap items below to build your look.</span>';$('#count').textContent=`(${selectedItems.length} selected)`;$('#chooser').querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{let id=b.dataset.choose;selectedItems=selectedItems.includes(id)?selectedItems.filter(x=>x!==id):[...selectedItems,id];redraw()})}redraw();$('#outfitForm').onsubmit=async e=>{e.preventDefault();if(!selectedItems.length){alert('Select at least one clothing item.');return}await put('outfits',{id:o.id||uid(),name:$('#outfitName').value.trim(),style:$('#style').value,occasion:$('#occasion').value.trim(),itemIds:[...selectedItems],createdAt:o.createdAt||Date.now()});closeModal();tab='build';refresh()}}
function openLog(outfitId=null){if(!outfits.length){alert('Create and save an outfit first.');tab='build';render();return}showModal(`<div class="section-head"><h2>Log what you wore</h2><button class="ghost" data-close>Close</button></div><form id="logForm"><div class="field"><label>Date</label><input type="date" id="wearDate" value="${selectedDate||today()}" required></div><div class="field"><label>Outfit</label><select id="wearOutfit">${outfits.map(o=>`<option value="${o.id}" ${o.id===outfitId?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div class="field"><label>Outfit selfie (optional)</label><input type="file" id="selfieFile" accept="image/*"><img id="selfiePreview" class="photo-preview hidden" alt="Selfie preview" style="margin-top:8px"></div><div class="field"><label>Notes (optional)</label><textarea id="wearNote" placeholder="Meeting, weather, outfit feedback..."></textarea></div><button class="primary full" type="submit">Save wear log</button></form>`);let selfie='';$('#selfieFile').onchange=async e=>{if(e.target.files?.[0]){try{selfie=await compress(e.target.files[0]);$('#selfiePreview').src=selfie;$('#selfiePreview').classList.remove('hidden')}catch(err){alert(err.message)}}};$('#logForm').onsubmit=async e=>{e.preventDefault();let d=$('#wearDate').value;await put('wears',{id:uid(),date:d,outfitId:$('#wearOutfit').value,note:$('#wearNote').value.trim(),selfie});selectedDate=d;month=d.slice(0,7);closeModal();tab='calendar';refresh()}}
async function importStarter(){let existing=new Set(items.map(x=>x.name.toLowerCase()));let added=0;for(let [name,category,color,brand] of STARTER){if(existing.has(name.toLowerCase()))continue;await put('items',{id:uid(),name,category,color,brand,notes:'Starter catalog entry. Please review and add your own photo.',price:null,photo:'',createdAt:Date.now()});added++}await refresh();alert(added+' wardrobe items added. Add photos to personalize them.');}
function exportBackup(){let data={app:'My Wardrobe',version:1,exportedAt:new Date().toISOString(),items,outfits,wears},blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`my-wardrobe-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(e){let f=e.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.app!=='My Wardrobe'||data.version!==1||!Array.isArray(data.items)||!Array.isArray(data.outfits)||!Array.isArray(data.wears))throw Error('This is not a valid My Wardrobe backup.');if(!confirm(`Import ${data.items.length} clothing items, ${data.outfits.length} outfits and ${data.wears.length} wear logs? Matching IDs will be replaced; other existing entries will remain.`))return;for(let [key,rows] of [['items',data.items],['outfits',data.outfits],['wears',data.wears]])for(let row of rows){if(!row.id||typeof row.id!=='string')throw Error('Invalid backup entry');await put(key,row)}await refresh();alert('Backup imported successfully.')}catch(err){alert('Could not import: '+err.message)}finally{e.target.value=''}}
(async()=>{try{db=await openDB();await refresh()}catch(e){$('#main').innerHTML='<div class="empty">Local storage is unavailable. Open in Safari (not private mode) or another modern browser.</div>';console.error(e)}})();
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
